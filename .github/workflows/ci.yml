name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - Lint & Import Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Check for syntax errors
        run: node --check server.js
        working-directory: backend

      - name: Check src imports resolve
        run: node -e "
          import('./src/app.js').then(
            () => console.log('✅ Backend imports OK'),
            (e) => { console.error('❌ Import error:', e.message); process.exit(1); }
          )
        "
        working-directory: backend

  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Frontend

      - name: Build project
        run: npx vite build
        working-directory: Frontend

      - name: Verify build output
        run: test -d dist && echo '✅ Build successful'
        working-directory: Frontend
